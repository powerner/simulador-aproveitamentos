<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f6;color:#222;min-height:100vh}
.container{max-width:800px;margin:0 auto;padding:20px 14px 60px}
.header{background:linear-gradient(135deg,#1a3a6e,#2a5298);color:#fff;border-radius:12px;padding:18px 22px;margin-bottom:18px}
.header h1{font-size:1.2rem;font-weight:700}
.header p{font-size:.85rem;opacity:.85;margin-top:3px}
.section{background:#fff;border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.section h2{font-size:.95rem;color:#1a3a6e;margin-bottom:12px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:.8rem;color:#555;display:block;margin-bottom:3px}
input,select{width:100%;padding:7px 10px;border:1px solid #ddd;border-radius:7px;font-size:.88rem;background:#fafafa;transition:border .15s}
input:focus,select:focus{outline:none;border-color:#2a5298;background:#fff}
.search-wrap{position:relative}
#busca{width:100%;padding:10px 14px;border:2px solid #ddd;border-radius:8px;font-size:.95rem}
#busca:focus{border-color:#2a5298;outline:none}
.dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ddd;border-radius:8px;margin-top:3px;max-height:240px;overflow-y:auto;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.12);display:none}
.dropdown.open{display:block}
.dd-item{padding:9px 14px;cursor:pointer;font-size:.87rem;border-bottom:1px solid #f0f0f0}
.dd-item:hover{background:#eef2ff}
.filtro-label{font-size:.82rem;color:#555;margin-bottom:6px;display:block}
.inst-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;border:1.5px solid #c8d8f0;background:#f7f9ff;font-size:.8rem;cursor:pointer;transition:all .15s;user-select:none;color:#444}
.chip:hover{border-color:#2a5298;background:#eef2ff}
.chip.ativo{background:#2a5298;border-color:#2a5298;color:#fff;font-weight:600}
.btn-limpar-filtro{font-size:.74rem;color:#c0392b;cursor:pointer;background:none;border:none;padding:0;margin-top:4px;display:none}
.btn-limpar-filtro.visible{display:inline}
.comp-title{background:#eef2ff;border-radius:8px;padding:9px 13px;margin-bottom:12px;font-size:.9rem;color:#1a3a6e;font-weight:600}
.inst-bloco{margin-bottom:14px}
.inst-nome{font-size:.78rem;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.opcao-label{font-size:.75rem;color:#888;margin:6px 0 3px;font-style:italic}
.opcao-card{border:1.5px solid #c8d8f0;border-radius:8px;padding:10px 13px;margin-bottom:6px;cursor:pointer;background:#f7f9ff;transition:all .15s;display:flex;align-items:center;gap:10px}
.opcao-card:hover{background:#e8eeff;border-color:#2a5298}
.opcao-card.adicionado{background:#d4edda;border-color:#28a745;cursor:default}
.conj-wrap{border:1.5px solid #c8d8f0;border-radius:8px;margin-bottom:6px;overflow:hidden}
.conj-header{background:#f0f4ff;padding:7px 13px;font-size:.78rem;font-weight:700;color:#2a5298;display:flex;align-items:center;gap:6px}
.conj-header.adicionado{background:#d4edda;color:#155724}
.conj-itens{padding:6px 10px}
.conj-item{display:flex;align-items:center;gap:8px;padding:5px 3px;font-size:.85rem;border-bottom:1px solid #eee;cursor:pointer}
.conj-item:last-child{border-bottom:none}
.conj-item:hover{color:#2a5298}
.conj-item.selecionado{color:#155724;font-weight:600}
.chk{width:16px;height:16px;border:2px solid #aaa;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px}
.chk.ok{background:#28a745;border-color:#28a745;color:#fff}
.badge{font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:12px;white-space:nowrap;margin-left:auto}
.badge-ok{background:#d4edda;color:#155724}
.aviso{background:#fff3cd;border-left:4px solid #ffc107;border-radius:6px;padding:9px 13px;font-size:.87rem;color:#856404;margin-top:8px}
.aviso-info{background:#e8f4fe;border-left:4px solid #2a5298;border-radius:6px;padding:9px 13px;font-size:.87rem;color:#1a3a6e;margin-top:8px}
.btn-novo{margin-top:12px;width:100%;padding:9px;border:2px dashed #2a5298;background:#fff;color:#2a5298;border-radius:8px;font-size:.88rem;cursor:pointer;font-weight:600;transition:background .15s}
.btn-novo:hover{background:#eef2ff}
.pedido-vazio{color:#aaa;font-size:.88rem;font-style:italic}
.pedido-item{background:#f0f4ff;border-left:4px solid #2a5298;border-radius:6px;padding:9px 13px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:flex-start}
.pedido-comp{font-size:.87rem;font-weight:700;color:#1a3a6e}
.pedido-sub{font-size:.78rem;color:#555;margin-top:2px;line-height:1.4}
.btn-rem{background:none;border:none;cursor:pointer;color:#c0392b;font-size:1.1rem;padding:0 3px;line-height:1;flex-shrink:0}
.btn-pdf{width:100%;padding:12px;background:linear-gradient(135deg,#1a3a6e,#2a5298);color:#fff;border:none;border-radius:8px;font-size:.98rem;font-weight:700;cursor:pointer;margin-top:14px;transition:opacity .15s}
.btn-pdf:hover{opacity:.9}
.divider{border:none;border-top:1px solid #eee;margin:12px 0}
@media(max-width:500px){.grid2{grid-template-columns:1fr}}
</style>
</head>

  <div class="section">

      <button class="btn-limpar-filtro" id="btn-limpar" onclick="limparFiltro()">✕ Limpar seleção</button>

    <div class="search-wrap">
      <input id="busca" type="text" placeholder="Digite o nome ou código da componente..." autocomplete="off">
      <div class="dropdown" id="dropdown"></div>
    </div>
    <div id="resultado"></div>
  </div>

  <div class="section">
    <h2>📄 Proposta de pedido</h2>
    <div id="lista-pedido"><p class="pedido-vazio">Nenhuma componente adicionada ainda.</p></div>
    <button class="btn-pdf" onclick="gerarPDF()">📥 Gerar proposta em PDF</button>
  </div>
</div>

var TODAS_INSTS = ['IFRN - Superior','IFRN - Técnico','UFERSA','UFPB','UFRN (anterior)','UFRN - Técnico','UNINTER','UNINASSAU','UnP'];
var instsFiltro = [];
var compSelecionada = null;
var pedido = [];
var conjSelecionados = {};
var componentes = Object.keys(DADOS).sort();

function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function hE(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Chips ─────────────────────────────────────────────────────────────────
function renderChips(){
  var wrap = document.getElementById('inst-chips');
  var html = '';
  TODAS_INSTS.forEach(function(inst){
    var ativo = instsFiltro.indexOf(inst) >= 0;
    html += '<div class="chip' + (ativo?' ativo':'') + '" data-inst="' + hE(inst) + '">' +
            '<span>' + (ativo?'✓':'+') + '</span> ' + hE(inst) + '</div>';
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll('.chip').forEach(function(chip){
    chip.addEventListener('click', function(){ toggleInst(chip.dataset.inst); });
  });
  var btn = document.getElementById('btn-limpar');
  btn.style.display = instsFiltro.length > 0 ? 'inline' : 'none';
  if(compSelecionada) renderResultado();
}

function toggleInst(inst){
  var idx = instsFiltro.indexOf(inst);
  if(idx >= 0) instsFiltro.splice(idx,1);
  else instsFiltro.push(inst);
  renderChips();
}

function limparFiltro(){ instsFiltro = []; renderChips(); }

renderChips();

// ── Busca ─────────────────────────────────────────────────────────────────
var buscaEl = document.getElementById('busca');
var ddEl    = document.getElementById('dropdown');

buscaEl.addEventListener('input', function(){
  var q = norm(buscaEl.value.trim());
  ddEl.innerHTML = '';
  if(!q){ ddEl.classList.remove('open'); return; }
  var found = componentes.filter(function(c){ return norm(c).indexOf(q) >= 0; });
  if(!found.length){ ddEl.classList.remove('open'); return; }
  found.forEach(function(c){
    var d = document.createElement('div');
    d.className = 'dd-item';
    d.textContent = c;
    d.addEventListener('click', function(){ selComp(c); });
    ddEl.appendChild(d);
  });
  ddEl.classList.add('open');
});

document.addEventListener('click', function(e){
  if(!e.target.closest('.search-wrap')) ddEl.classList.remove('open');
});

function selComp(c){
  compSelecionada = c;
  buscaEl.value = c;
  ddEl.classList.remove('open');
  conjSelecionados = {};
  renderResultado();
}

// ── Resultado ─────────────────────────────────────────────────────────────
function compJaAdicionada(comp_ufrn){
  return pedido.some(function(p){ return p.comp_ufrn === comp_ufrn; });
}

function encontrarOpcao(id_opcao){
  if(!compSelecionada) return null;
  var insts = DADOS[compSelecionada].instituicoes;
  var keys = Object.keys(insts);
  for(var i=0;i<keys.length;i++){
    var ops = insts[keys[i]];
    for(var j=0;j<ops.length;j++){
      if(ops[j].id_opcao === id_opcao) return ops[j];
    }
  }
  return null;
}

function renderResultado(){
  var el = document.getElementById('resultado');
  if(!compSelecionada){ el.innerHTML = ''; return; }

  var info = DADOS[compSelecionada];
  var insts = info.instituicoes;
  var keys = Object.keys(insts);
  var filtradas = instsFiltro.length === 0 ? keys : keys.filter(function(k){ return instsFiltro.indexOf(k) >= 0; });

  var html = '<hr class="divider"><div class="comp-title">📚 ' + hE(compSelecionada) + '</div>';

  if(!filtradas.length){
    if(instsFiltro.length > 0){
      html += '<div class="aviso">Nenhuma equivalência para as instituições selecionadas nesta componente.</div>';
    } else {
      html += '<div class="aviso">Não há equivalentes registradas para esta componente.</div>';
    }
  } else {
    filtradas.forEach(function(inst){
      var opcoes = insts[inst];
      html += '<div class="inst-bloco"><div class="inst-nome">🏛️ ' + hE(inst) + '</div>';
      opcoes.forEach(function(op){
        var jaAdicionado = pedido.some(function(p){ return p.id_opcao === op.id_opcao; });
        if(opcoes.length > 1){
          html += '<div class="opcao-label">Opção ' + op.num_opcao + '</div>';
        }
        if(op.requer_conjunto){
          var sel = conjSelecionados[op.id_opcao] || {};
          var conjBloqueado = compJaAdicionada(compSelecionada) && !jaAdicionado;
          html += '<div class="conj-wrap"' + (conjBloqueado?' style="opacity:.45"':'') + '>';
          html += '<div class="conj-header' + (jaAdicionado?' adicionado':'') + '">';
          html += '<span>📦 Conjunto — cursar os ' + op.componentes.length + ' abaixo</span>';
          if(jaAdicionado) html += '<span class="badge badge-ok" style="margin-left:auto">✔ Adicionado</span>';
          if(conjBloqueado) html += '<span class="badge" style="background:#eee;color:#aaa;margin-left:auto">Indisponível</span>';
          html += '</div><div class="conj-itens">';
          op.componentes.forEach(function(comp, ci){
            var isSel = sel[ci] || jaAdicionado;
            html += '<div class="conj-item' + (isSel?' selecionado':'') + '"' +
                    ' data-type="conj" data-opcao-id="' + op.id_opcao + '" data-comp-idx="' + ci + '"' +
                    ((jaAdicionado||conjBloqueado)?' style="cursor:default"':'') + '>' +
                    '<div class="chk' + (isSel?' ok':'') + '">' + (isSel?'✓':'') + '</div>' +
                    '<span>' + hE(comp) + '</span></div>';
          });
          html += '</div></div>';
        } else {
          var comp = op.componentes[0];
          var compBloqueada = compJaAdicionada(compSelecionada) && !jaAdicionado;
          html += '<div class="opcao-card' + (jaAdicionado?' adicionado':compBloqueada?' bloqueado':'') + '"' +
                  ' data-type="simples" data-opcao-id="' + op.id_opcao + '"' +
                  (jaAdicionado||compBloqueada?' style="cursor:default;opacity:.45"':'') + '>' +
                  '<div class="chk' + (jaAdicionado?' ok':'') + '">' + (jaAdicionado?'✓':'') + '</div>' +
                  '<span style="flex:1;font-size:.87rem">' + hE(comp) + '</span>' +
                  (compBloqueada ? '<span class="badge" style="background:#eee;color:#aaa">Indisponível</span>' : '') +
                  '</div>';
        }
      });
      html += '</div>';
    });
  }

  html += '<button class="btn-novo" id="btn-novo-pedido">📝 Minha instituição não está na lista — Solicitar nova apreciação</button>';
  el.innerHTML = html;

  // Event delegation
  el.addEventListener('click', function(e){
    var card = e.target.closest('[data-type]');
    if(!card) {
      if(e.target.id === 'btn-novo-pedido') novoPedido();
      return;
    }
    var tipo = card.dataset.type;
    var id_opcao = parseInt(card.dataset.opcaoId, 10);
    var op = encontrarOpcao(id_opcao);
    if(!op) return;

    // Determina a instituição a partir do bloco pai
    var blocoNome = card.closest('.inst-bloco');
    var inst = blocoNome ? blocoNome.querySelector('.inst-nome').textContent.replace('🏛️ ','').trim() : '';

    if(tipo === 'simples'){
      if(compJaAdicionada(compSelecionada)) return;
      pedido.push({ comp_ufrn: compSelecionada, inst: inst, id_opcao: id_opcao, componentes: op.componentes, label: op.componentes[0] });
      renderPedido();
      renderResultado();
    } else if(tipo === 'conj'){
      if(card.style.cursor === 'default') return;
      if(compJaAdicionada(compSelecionada) && !pedido.some(function(p){ return p.id_opcao === id_opcao; })) return;
      var ci = parseInt(card.dataset.compIdx, 10);
      var comp = op.componentes[ci];
      if(!conjSelecionados[id_opcao]) conjSelecionados[id_opcao] = {};
      var sel = conjSelecionados[id_opcao];
      sel[ci] = !sel[ci];
      var todos = op.componentes.every(function(_, k){ return sel[k]; });
      if(todos){
        if(!pedido.some(function(p){ return p.id_opcao === id_opcao; })){
          pedido.push({ comp_ufrn: compSelecionada, inst: inst, id_opcao: id_opcao, componentes: op.componentes, label: op.componentes.join(' + ') });
          renderPedido();
        }
      } else {
        var idx = pedido.findIndex(function(p){ return p.id_opcao === id_opcao; });
        if(idx >= 0){ pedido.splice(idx,1); renderPedido(); }
      }
      renderResultado();
    }
  }, { once: true });
}

function novoPedido(){
  var el = document.getElementById('resultado');
  if(el.querySelector('.aviso-info')) return;
  var d = document.createElement('div');
  d.className = 'aviso-info';
  d.textContent = '📌 Para solicitar nova apreciação, procure a Coordenação do Curso com histórico escolar e ementa da disciplina cursada.';
  el.appendChild(d);
}

function remover(idx){
  var item = pedido[idx];
  delete conjSelecionados[item.id_opcao];
  pedido.splice(idx,1);
  renderPedido();
  renderResultado();
}

function renderPedido(){
  var el = document.getElementById('lista-pedido');
  if(!pedido.length){ el.innerHTML = '<p class="pedido-vazio">Nenhuma componente adicionada ainda.</p>'; return; }
  var html = '';
  pedido.forEach(function(p, i){
    html += '<div class="pedido-item">' +
            '<div style="flex:1"><div class="pedido-comp">' + hE(p.comp_ufrn) + '</div>' +
            '<div class="pedido-sub">🏛️ ' + hE(p.inst) + '<br>' + hE(p.label) + '</div></div>' +
            '<button class="btn-rem" data-idx="' + i + '">🗑️</button></div>';
  });
  el.innerHTML = html;
  el.querySelectorAll('.btn-rem').forEach(function(btn){
    btn.addEventListener('click', function(){ remover(parseInt(btn.dataset.idx, 10)); });
  });
}

// ── PDF ───────────────────────────────────────────────────────────────────
function gerarPDF(){
  var nome      = document.getElementById('nome').value.trim();
  var matricula = document.getElementById('matricula').value.trim();
  var turno     = document.getElementById('turno').value;
  var instOrig  = document.getElementById('inst_origem').value.trim();
  if(!nome || !matricula){ alert('Preencha nome e matrícula antes de gerar o PDF.'); return; }
  if(!pedido.length)     { alert('Adicione ao menos uma componente à proposta.'); return; }

  var doc = new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  var W=210,ml=15,mr=15,cw=W-ml-mr;
  var y=14;

  doc.setFont('times','normal'); doc.setFontSize(8); doc.setTextColor(0,0,0);
  doc.text('MINISTÉRIO DA EDUCAÇÃO',W/2,y,{align:'center'}); y+=4.5;
  doc.text('UNIVERSIDADE FEDERAL DO RIO GRANDE DO NORTE',W/2,y,{align:'center'}); y+=4.5;
  doc.text('COORDENAÇÃO DO CURSO ENGENHARIA DE PRODUÇÃO',W/2,y,{align:'center'}); y+=8;

  doc.setFont('times','bold'); doc.setFontSize(9);
  doc.text('PROPOSTA DE APROVEITAMENTO DE ESTUDOS',W/2,y,{align:'center'}); y+=5;
  doc.setFont('times','normal'); doc.setFontSize(7.5); doc.setTextColor(120,0,0);
  doc.text('DOCUMENTO NÃO OFICIAL — Sujeito a validação e protocolação pela Coordenação do Curso',W/2,y,{align:'center'}); y+=5;
  doc.setTextColor(0,0,0);
  doc.setDrawColor(0,0,0); doc.setLineWidth(0.4); doc.line(ml,y,W-mr,y); y+=5;

  var hoje = new Date();
  var meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  doc.setFontSize(8.5);
  doc.text('Natal-RN, ' + hoje.getDate() + ' de ' + meses[hoje.getMonth()] + ' de ' + hoje.getFullYear() + '.', W-mr, y, {align:'right'}); y+=7;

  doc.setFont('times','bold'); doc.setFontSize(8.5);
  doc.text('NOME DO ALUNO: ',ml,y);
  doc.setFont('times','normal'); doc.text(nome.toUpperCase(),ml+33,y); y+=6;
  doc.setFont('times','bold'); doc.text('CURSO: ',ml,y);
  doc.setFont('times','normal'); doc.text('ENGENHARIA DE PRODUÇÃO',ml+14,y);
  doc.setFont('times','bold'); doc.text('TURNO: ',ml+96,y);
  doc.setFont('times','normal'); doc.text(turno.toUpperCase(),ml+110,y); y+=6;
  doc.setFont('times','bold'); doc.text('CADASTRO (MATRICULA): ',ml,y);
  doc.setFont('times','normal'); doc.text(matricula,ml+44,y);
  doc.setFont('times','bold'); doc.text('INSTITUICAO DE ORIGEM: ',ml+96,y);
  doc.setFont('times','normal'); doc.text(instOrig.toUpperCase(),ml+140,y); y+=8;

  var cols=[40,50,90];
  doc.setFillColor(26,58,110); doc.rect(ml,y,cw,7,'F');
  doc.setTextColor(255,255,255); doc.setFont('times','bold'); doc.setFontSize(7.5);
  doc.text('REF. A INST. DE ORIGEM',ml+(cols[0]+cols[1])/2,y+4.5,{align:'center'});
  doc.text('REFERENCIAS RELATIVAS A UFRN',ml+cols[0]+cols[1]+cols[2]/2,y+4.5,{align:'center'}); y+=7;
  doc.setFillColor(50,80,150);
  [0,1,2].forEach(function(i){ doc.rect(ml+(i===0?0:i===1?cols[0]:cols[0]+cols[1]),y,cols[i],8,'F'); });
  doc.setFontSize(6.5);
  doc.text('INSTITUICAO\nDE ORIGEM',ml+cols[0]/2,y+2.5,{align:'center'});
  doc.text('NOME DO COMP. CURSADO\n(IDENTICO AO HISTORICO)',ml+cols[0]+cols[1]/2,y+2.5,{align:'center'});
  doc.text('COMP. CURRICULAR\nA SER IMPLANTADO (UFRN)',ml+cols[0]+cols[1]+cols[2]/2,y+2.5,{align:'center'}); y+=8;

  doc.setTextColor(0,0,0); doc.setFont('times','normal');
  pedido.forEach(function(p, i){
    var fill = i%2===0;
    if(fill) doc.setFillColor(240,244,255); else doc.setFillColor(255,255,255);
    doc.setDrawColor(180,180,200); doc.setLineWidth(0.2);
    var cursLines = doc.splitTextToSize(p.label, cols[1]-4);
    var ufrLines  = doc.splitTextToSize(p.comp_ufrn, cols[2]-4);
    var h = Math.max(cursLines.length, ufrLines.length)*4+4;
    doc.rect(ml,y,cols[0],h,'FD');
    doc.rect(ml+cols[0],y,cols[1],h,'FD');
    doc.rect(ml+cols[0]+cols[1],y,cols[2],h,'FD');
    doc.setFontSize(7.5);
    doc.text(p.inst, ml+cols[0]/2, y+h/2, {align:'center',baseline:'middle'});
    doc.text(cursLines, ml+cols[0]+2, y+3);
    doc.text(ufrLines,  ml+cols[0]+cols[1]+2, y+3);
    y += h;
  });

  doc.setFillColor(230,235,250); doc.rect(ml,y,cw,10,'FD');
  doc.setFont('times','bold'); doc.setFontSize(8);
  doc.text('OBSERVACOES:',ml+2,y+6); y+=18;

  doc.setDrawColor(150,0,0); doc.setLineWidth(0.3); doc.rect(ml,y,cw,22,'D');
  doc.setFont('times','bold'); doc.setFontSize(7.5); doc.setTextColor(120,0,0);
  doc.text('ATENCAO:',ml+3,y+5);
  doc.setFont('times','normal'); doc.setTextColor(0,0,0); doc.setFontSize(7);
  var avLines = doc.splitTextToSize(
    'Este documento e uma proposta gerada automaticamente com base em aproveitamentos previamente registrados. As correspondencias podem estar desatualizadas. O deferimento esta condicionado a analise documental pela Coordenacao do Curso mediante apresentacao de historico escolar e ementas. Este documento nao substitui o protocolo oficial no SIGAA.',
    cw-6);
  doc.text(avLines,ml+3,y+10); y+=28;

  doc.setFont('times','normal'); doc.setFontSize(8.5); doc.setTextColor(0,0,0);
  doc.text('Assinatura do Aluno: ___________________________________________',ml,y); y+=6;
  doc.setFont('times','italic'); doc.setFontSize(7.5);
  doc.text('Data: ______ / ______ / ________',ml,y); y+=12;
  doc.setLineWidth(0.5); doc.setDrawColor(0,0,0); doc.line(ml,y,W-mr,y); y+=4;
  doc.setFont('times','italic'); doc.setFontSize(6.5); doc.setTextColor(100,100,100);
  doc.text('Proposta gerada pelo Simulador de Aproveitamentos - Coordenacao do Curso de Engenharia de Producao / UFRN',W/2,y,{align:'center'});

  doc.save('proposta_aproveitamento_' + matricula + '.pdf');
}
